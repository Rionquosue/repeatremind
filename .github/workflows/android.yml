name: Android
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - name: Read release version
        id: version
        shell: python
        run: |
          import os, pathlib, re
          text = pathlib.Path('app/build.gradle').read_text()
          version = re.search(r"versionName\s+['\"](\d+\.\d+\.\d+)['\"]", text).group(1)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'tag=V{version}\n')
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Test, lint, and build
        run: ./gradlew recurrenceTest reminderStateTest colourTest lintDebug assembleDebug assembleRelease assembleAndroidTest --no-daemon
      - name: Enable KVM for Android tests
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run native device tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb install -r app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb shell pm grant style.spacedragon.repeatremind android.permission.POST_NOTIFICATIONS
            adb shell appops set style.spacedragon.repeatremind SCHEDULE_EXACT_ALARM allow
            adb shell am instrument -w style.spacedragon.repeatremind.test/style.spacedragon.repeatremind.SmokeInstrumentation | tee smoke-results.txt
            adb logcat -d -b crash > smoke-crash.txt
            cat smoke-crash.txt
            adb exec-out run-as style.spacedragon.repeatremind cat cache/smoke-missed.png > smoke-missed.png
            adb exec-out run-as style.spacedragon.repeatremind cat cache/smoke-custom.png > smoke-custom.png
            adb exec-out run-as style.spacedragon.repeatremind cat cache/smoke-editor.png > smoke-editor.png
            adb exec-out run-as style.spacedragon.repeatremind cat cache/smoke-theme-0.png > smoke-theme-0.png
            grep -q 'PASS:.*Android smoke checks' smoke-results.txt
      - name: Save device test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Android-test-results
          path: |
            smoke-results.txt
            smoke-crash.txt
            smoke-*.png
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: RepeatRemind-release-unsigned
          path: app/build/outputs/apk/release/app-release-unsigned.apk
  publish:
    name: Publish GitHub Release
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: RepeatRemind-release-unsigned
          path: dist/release
      - name: Publish APKs
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.build.outputs.release_tag }}
        run: |
          cp dist/release/app-release-unsigned.apk dist/RepeatRemind-release-unsigned.apk
          cat > release-notes.md <<'NOTES'
          Automatically built and checked by GitHub Actions.

          - Completion resets at the start of the next scheduled local date.
          - Saved completion history and a Missed days tab.
          - Completed buttons and single-line weekday highlights.
          - Custom background, button, highlight, and text colours.

          **RepeatRemind-release-unsigned.apk** is the optimized release build for Android 8.0+. Sign it with your own private key before installing. Debug builds remain local.
          NOTES
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            EXISTING_SHA=$(gh api "repos/$GH_REPO/git/ref/tags/$RELEASE_TAG" --jq '.object.sha')
            if [ "$EXISTING_SHA" != "$GITHUB_SHA" ]; then
              echo 'This version is already released. Increase versionName and versionCode before publishing another commit.' >&2
              exit 1
            fi
            gh release upload "$RELEASE_TAG" dist/RepeatRemind-release-unsigned.apk --clobber
            exit 0
          fi
          gh release create "$RELEASE_TAG" \
            dist/RepeatRemind-release-unsigned.apk \
            --target "$GITHUB_SHA" \
            --title "RepeatRemind $RELEASE_TAG" \
            --notes-file release-notes.md --latest
      - name: Verify published release and APK
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.build.outputs.release_tag }}
        run: |
          gh release view "$RELEASE_TAG" --json tagName,isDraft,assets > published-release.json
          jq -e --arg tag "$RELEASE_TAG" '.tagName == $tag and .isDraft == false and (.assets | length) == 1 and .assets[0].name == "RepeatRemind-release-unsigned.apk" and .assets[0].size > 0' published-release.json
