name: Android
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Test, lint, and build
        run: ./gradlew jvmTests lintDebug assembleDebug assembleRelease assembleAndroidTest --no-daemon
      - name: Enable KVM for Android tests
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run native device tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb install -r app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb shell pm grant style.spacedragon.repeatremind android.permission.POST_NOTIFICATIONS
            adb shell appops set style.spacedragon.repeatremind SCHEDULE_EXACT_ALARM allow
            adb shell am instrument -w style.spacedragon.repeatremind.test/style.spacedragon.repeatremind.SmokeInstrumentation | tee smoke-results.txt
            adb logcat -d -b crash > smoke-crash.txt
            cat smoke-crash.txt
            adb exec-out run-as style.spacedragon.repeatremind cat cache/smoke-missed.png > smoke-missed.png
            adb exec-out run-as style.spacedragon.repeatremind cat cache/smoke-custom.png > smoke-custom.png
            adb exec-out run-as style.spacedragon.repeatremind cat cache/smoke-editor.png > smoke-editor.png
            adb exec-out run-as style.spacedragon.repeatremind cat cache/smoke-theme-0.png > smoke-theme-0.png
            adb exec-out run-as style.spacedragon.repeatremind cat cache/smoke-tracker.png > smoke-tracker.png
            adb exec-out run-as style.spacedragon.repeatremind cat cache/smoke-day.png > smoke-day.png
            grep -q 'PASS:.*Android smoke checks' smoke-results.txt
      - name: Save device test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Android-test-results
          path: |
            smoke-results.txt
            smoke-crash.txt
            smoke-*.png
          if-no-files-found: ignore
