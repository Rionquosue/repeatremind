plugins { id 'com.android.application' }

android {
    namespace 'style.spacedragon.repeatremind'
    compileSdk 36

    defaultConfig {
        applicationId 'style.spacedragon.repeatremind'
        minSdk 26
        targetSdk 36
        versionCode 3
        versionName '0.1.1'
        testInstrumentationRunner 'style.spacedragon.repeatremind.SmokeInstrumentation'
    }
    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    // Framework widgets, java.time and org.json are provided by Android.
    // Deliberately no app dependencies, Kotlin runtime, services or network SDKs.
}
