plugins {
    id 'com.android.application' version '9.4.1' apply false
}

tasks.register('compileRecurrenceTests', JavaCompile) {
    source = files('app/src/main/java/style/spacedragon/repeatremind/Schedule.java',
            'app/src/main/java/style/spacedragon/repeatremind/Recurrence.java',
            'app/src/main/java/style/spacedragon/repeatremind/TaskState.java',
            'app/src/main/java/style/spacedragon/repeatremind/ColourMath.java',
            'tests/RecurrenceTest.java', 'tests/ReminderStateTest.java', 'tests/ColourMathTest.java')
    classpath = files()
    sourceCompatibility = '17'
    targetCompatibility = '17'
    destinationDirectory = layout.buildDirectory.dir('recurrence-tests')
    options.release = 17
}
tasks.register('reminderStateTest', JavaExec) {
    dependsOn 'compileRecurrenceTests'
    classpath = files(layout.buildDirectory.dir('recurrence-tests'))
    mainClass = 'style.spacedragon.repeatremind.ReminderStateTest'
}
tasks.register('recurrenceTest', JavaExec) {
    dependsOn 'compileRecurrenceTests'
    classpath = files(layout.buildDirectory.dir('recurrence-tests'))
    mainClass = 'style.spacedragon.repeatremind.RecurrenceTest'
}
tasks.register('colourTest', JavaExec) {
    dependsOn 'compileRecurrenceTests'
    classpath = files(layout.buildDirectory.dir('recurrence-tests'))
    mainClass = 'style.spacedragon.repeatremind.ColourMathTest'
}
